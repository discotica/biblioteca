<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Work Sans (U26): texto (400) y botones (600). Rutas iguales a src/lib/styles/fonts.css. -->
		<link rel="preload" href="/fonts/work-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/work-sans-latin-600.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="theme-color" content="#101010" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Biblioteca Discótica" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
