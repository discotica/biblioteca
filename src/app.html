<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Work Sans (U26): texto (400) y botones (600). Rutas iguales a src/lib/styles/fonts.css. -->
		<link rel="preload" href="/fonts/work-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/work-sans-latin-600.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="theme-color" content="#101010" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Biblioteca Discótica" />
		<!-- Vista previa de enlaces: genérica para todo el sitio. En /lanzamiento y
		     /coleccion, static/vista-previa.php reemplaza el bloque con la ficha. -->
		<!-- vista-previa -->
		<title>Biblioteca Discótica</title>
		<meta name="description" content="Una biblioteca para pies y cabeza — Orgullo sudaca" />
		<meta property="og:site_name" content="Biblioteca Discótica" />
		<meta property="og:locale" content="es_LA" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Biblioteca Discótica" />
		<meta property="og:description" content="Una biblioteca para pies y cabeza — Orgullo sudaca" />
		<meta property="og:image" content="https://biblioteca.discotica.com/img/vista-previa.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- /vista-previa -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
